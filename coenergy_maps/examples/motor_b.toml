schema_version = 1

[input]
csv = "motor_b_vi.csv"
format = "mapped_dq"

[input.columns]
source_no = "PTN_No"
pair_id = "pair_group"
rpm = "RPM_moni"
id_ref_A = "Idref_moni"
iq_ref_A = "Iqref_moni"
id_A = "Id0_1st"
iq_A = "Iq0_1st"
vd_V = "Vd_1st"
vq_V = "Vq_1st"

[output]
directory = "../output/motor_b"

[motor]
name = "synthetic_motor_b_negative_speed"
pole_pairs = 7
dq_convention = "power_invariant"
stator_resistance_ohm = 0.12
temperature_degC = 60.0
stator_resistance_temperature_degC = 60.0

[fit]
selection = "explicit"
i_base_A = 40.0
psi_base_Wb = 0.035
u_breakpoints = [-1.0, -0.5, 0.0, 0.5, 1.0]
v_breakpoints = [0.0, 0.25, 0.5, 0.75, 1.0]
roughness_weight = 0.0
ridge_weight = 0.0
solver = "dense_gelsd"
active_basis_tolerance = 1e-14
rank_tolerance = 1e-12
quadrature_order = 4
